<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Freedom PDF</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="container">
      <div class="header">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          ></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <h1>Freedom PDF</h1>
      </div>
      <p class="subtitle">Fast, secure, and memory-efficient.</p>
      <div id="picker-buttons">
        <button id="open-viewer">Open PDF Workspace</button>
        <button id="open-file-btn" class="secondary-btn" style="margin-top: 8px; width: 100%;">Open Local PDF</button>
      </div>

      <div id="file-access-warning" class="warning-card hidden">
        <div class="warning-header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <span>Local File Access Required</span>
        </div>
        <p>To enable drag-and-drop or opening local files directly, you must configure Chrome to allow local PDF access.</p>
        <button id="configure-btn" class="secondary-btn warning-action-btn">Configure Extension</button>
      </div>

      <div class="secondary-actions">
        <a
          id="donate-btn"
          class="secondary-btn donate-btn"
          href="https://www.paypal.com/paypalme/jscheema/5USD"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
          ☕ Donate
        </a>

      </div>
      <div id="version-display" class="version-display"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
